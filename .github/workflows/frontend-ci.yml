name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      # Generate a lockfile in CI until the first npm lockfile is committed.
      # Once package-lock.json is checked in, replace this with `npm ci`.
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test SSE client
        run: npm test
      - name: Type check
        run: npm run typecheck
      - name: Build frontend
        run: npm run build
