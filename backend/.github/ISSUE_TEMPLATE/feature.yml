name: Feature request
description: Propose an implementation task
body:
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: What user or operator capability should exist?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable, testable outcomes.
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Security, failure, and migration considerations
    validations:
      required: true
