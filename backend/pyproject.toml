[build-system]
requires = ["hatchling>=1.27,<2.0"]
build-backend = "hatchling.build"

[project]
name = "ask-ai-api"
version = "0.1.0"
description = "Backend API for the Ask AI multi-provider chat platform"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic>=1.20.1,<2.0",
    "authlib>=1.9.5,<1.10",
    "asyncpg>=0.31,<1.0",
    "email-validator>=2.3,<3.0",
    "fastapi[standard]>=0.162.6,<0.163",
    "httpx2>=2.16,<3.0",
    "itsdangerous>=2.2,<3.0",
    "joserfc>=1.6.8,<2.0",
    "pydantic>=2.14.3,<3.0",
    "pydantic-settings>=2.16.3,<3.0",
    "pyjwt[crypto]>=2.15.1,<3.0",
    "pwdlib[argon2]>=0.3.1,<0.4",
    "redis>=8.1,<9.0",
    "sqlalchemy[asyncio]>=2.1.8,<2.2",
    "structlog>=26.1,<27.0",
]

[dependency-groups]
dev = [
    "mypy>=1.15,<2.0",
    "pytest>=8.3,<10.0",
    "pytest-asyncio>=1.0,<2.0",
    "pytest-cov>=6.0,<8.0",
    "aiosqlite>=0.21,<1.0",
    "ruff>=0.11,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ask_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers --strict-config"
markers = [
    "integration: requires external PostgreSQL and/or Redis services",
]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"backend/tests/**/*.py" = ["S105", "S106"]

[tool.mypy]
python_version = "3.14"
strict = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["redis.*"]
ignore_missing_imports = true
